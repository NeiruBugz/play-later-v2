version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "terraform"
    directories:
      - "/infra/envs/dev"
      - "/infra/envs/prod"
      - "/infra/stacks/storefront-sync/shared"
      - "/infra/stacks/storefront-sync/prod"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(infra)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
