name: PR Infra Checks (Terraform)

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/pr-checks-infra.yml"

concurrency:
  group: pr-checks-infra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.14.6"

jobs:
  fmt:
    name: Terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive -diff
        working-directory: infra

  validate:
    name: Validate and lint (${{ matrix.root }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - infra/envs/dev
          - infra/envs/prod
          - infra/stacks/storefront-sync/shared
          - infra/stacks/storefront-sync/prod
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # No backend, no credentials: init only downloads providers to validate against.
      - name: Terraform init
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Terraform validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - name: TFLint
        run: tflint --chdir=.
